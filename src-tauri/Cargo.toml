[package]
name = "sift"
version = "0.1.0"
description = "A fast, safe Downloads organiser"
authors = ["Sift"]
edition = "2021"

[lib]
name = "sift_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
trash = "5"
mime_guess = "2"
dirs = "6"
thiserror = "2"
windows = { version = "0.61", features = ["Win32_Security_Authentication_Identity"] }

